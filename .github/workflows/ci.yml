name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-tests:
    name: vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # node:sqlite (used for the local job store) requires Node >= 22.5,
        # so that is the real minimum — Node 20 cannot run this codebase.
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Chromium for the browser-automation tests (they drive local file://
      # fixtures only — no live job sites). Without it those tests self-skip,
      # which is exactly the silent gap CI exists to close.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  python-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
