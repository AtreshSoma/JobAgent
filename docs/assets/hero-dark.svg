<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Job Agent</title>
  <desc id="d">Find, score, tailor and fill automatically. You click Submit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="339" rx="17.5" fill="none" stroke="#30363d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="15" font-weight="600" letter-spacing="2.4" fill="#8b949e">LOCAL-FIRST JOB SEARCH ASSISTANT</text>
    <text x="62" y="168" font-size="64" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">Job Agent</text>
    <text x="64" y="212" font-size="21" fill="#c9d1d9">It finds the roles, scores the fit, tailors the resume,</text>
    <text x="64" y="242" font-size="21" fill="#c9d1d9">and fills the form. <tspan font-weight="700" fill="#f2b84b">You click Submit.</tspan></text>

    <g transform="translate(690 92)">
      <line x1="96" y1="58" x2="128" y2="58" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="226" y1="58" x2="258" y2="58" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="356" y1="58" x2="388" y2="58" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M437 104 V134" stroke="#f2b84b" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>

      <g>
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="48" cy="46" r="13" fill="#0c2d48"/>
        <circle cx="46" cy="44" r="6" fill="none" stroke="#58a6ff" stroke-width="2.2"/>
        <path d="M50.5 48.5L55 53" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f6fc">Find</text>
      </g>
      <g transform="translate(130 0)">
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="48" cy="46" r="13" fill="#2a1f4d"/>
        <path d="M41 52V46M48 52V40M55 52V43" stroke="#bc8cff" stroke-width="2.6" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f6fc">Score</text>
      </g>
      <g transform="translate(260 0)">
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="48" cy="46" r="13" fill="#12361f"/>
        <path d="M42 39H51L55 43V53H42Z" fill="none" stroke="#56d364" stroke-width="2" stroke-linejoin="round"/>
        <path d="M45 46H52M45 49.5H50" stroke="#56d364" stroke-width="1.8" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f6fc">Tailor</text>
      </g>
      <g transform="translate(390 0)">
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle cx="48" cy="46" r="13" fill="#3a2f0b"/>
        <rect x="40" y="40" width="16" height="12" rx="2" fill="none" stroke="#e3b341" stroke-width="2"/>
        <path d="M43 46H53" stroke="#e3b341" stroke-width="1.8" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f6fc">Fill</text>
      </g>

      <g transform="translate(360 136)">
        <rect x="0" y="0" width="156" height="56" rx="28" fill="#3d2a07" stroke="#f2b84b" stroke-width="2"/>
        <circle cx="30" cy="28" r="13" fill="#f2b84b"/>
        <path d="M24 28.5L28.5 33L36.5 24" stroke="#0d1117" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="96" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#fde7b0">You submit</text>
      </g>

      <text x="0" y="176" font-size="13" fill="#8b949e">Automatic</text>
      <text x="0" y="196" font-size="13" fill="#8b949e">deterministic · local · auditable</text>
      <text x="344" y="226" font-size="13" fill="#f2b84b">Human-gated by design</text>
    </g>
  </g>
</svg>
