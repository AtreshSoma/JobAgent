<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Job Agent</title>
  <desc id="d">Find, score, tailor and fill automatically. You click Submit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="339" rx="17.5" fill="none" stroke="#e2e8f0"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Title block -->
    <text x="64" y="104" font-size="15" font-weight="600" letter-spacing="2.4" fill="#475569">LOCAL-FIRST JOB SEARCH ASSISTANT</text>
    <text x="62" y="168" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Job Agent</text>
    <text x="64" y="212" font-size="21" fill="#334155">It finds the roles, scores the fit, tailors the resume,</text>
    <text x="64" y="242" font-size="21" fill="#334155">and fills the form. <tspan font-weight="700" fill="#b45309">You click Submit.</tspan></text>

    <!-- Pipeline -->
    <g transform="translate(690 92)">
      <line x1="96" y1="58" x2="128" y2="58" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="226" y1="58" x2="258" y2="58" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="356" y1="58" x2="388" y2="58" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M437 104 V134" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>

      <g>
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
        <circle cx="48" cy="46" r="13" fill="#e0f2fe"/>
        <circle cx="46" cy="44" r="6" fill="none" stroke="#0369a1" stroke-width="2.2"/>
        <path d="M50.5 48.5L55 53" stroke="#0369a1" stroke-width="2.4" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Find</text>
      </g>
      <g transform="translate(130 0)">
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
        <circle cx="48" cy="46" r="13" fill="#ede9fe"/>
        <path d="M41 52V46M48 52V40M55 52V43" stroke="#6d28d9" stroke-width="2.6" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Score</text>
      </g>
      <g transform="translate(260 0)">
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
        <circle cx="48" cy="46" r="13" fill="#dcfce7"/>
        <path d="M42 39H51L55 43V53H42Z" fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M45 46H52M45 49.5H50" stroke="#15803d" stroke-width="1.8" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Tailor</text>
      </g>
      <g transform="translate(390 0)">
        <rect x="0" y="16" width="96" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
        <circle cx="48" cy="46" r="13" fill="#fef9c3"/>
        <rect x="40" y="40" width="16" height="12" rx="2" fill="none" stroke="#a16207" stroke-width="2"/>
        <path d="M43 46H53" stroke="#a16207" stroke-width="1.8" stroke-linecap="round"/>
        <text x="48" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Fill</text>
      </g>

      <!-- Human gate -->
      <g transform="translate(360 136)">
        <rect x="0" y="0" width="156" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <circle cx="30" cy="28" r="13" fill="#d97706"/>
        <path d="M24 28.5L28.5 33L36.5 24" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="96" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#78350f">You submit</text>
      </g>

      <text x="0" y="176" font-size="13" fill="#64748b">Automatic</text>
      <text x="0" y="196" font-size="13" fill="#64748b">deterministic · local · auditable</text>
      <text x="344" y="226" font-size="13" fill="#92400e">Human-gated by design</text>
    </g>
  </g>
</svg>
