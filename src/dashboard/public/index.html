<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>JobAgent — Dashboard</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #eef2f7;
      --text: #182230;
      --muted: #5d6878;
      --faint: #7d8795;
      --border: #dce2ea;
      --border-strong: #c8d0db;
      --accent: #2854d7;
      --accent-strong: #1f43b0;
      --accent-soft: #e8edff;
      --good: #117653;
      --good-soft: #e5f5ee;
      --warn: #915800;
      --warn-soft: #fff1d6;
      --danger: #b42318;
      --danger-soft: #fee9e7;
      --info: #116a8b;
      --info-soft: #e2f3f8;
      --shadow: 0 10px 30px rgba(24, 34, 48, .08);
      --rail: 0px;
      --header: 64px;
      --radius: 10px;
      --radius-sm: 7px;
      --focus: 0 0 0 3px rgba(40, 84, 215, .24);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    html[data-theme="dark"] {
      --bg: #0e131b;
      --surface: #151c26;
      --surface-2: #19222e;
      --surface-3: #222d3a;
      --text: #edf2f7;
      --muted: #a8b3c1;
      --faint: #8591a1;
      --border: #2b3745;
      --border-strong: #3a4858;
      --accent: #7da2ff;
      --accent-strong: #a9c0ff;
      --accent-soft: #223259;
      --good: #67d6ad;
      --good-soft: #17382e;
      --warn: #f2bd69;
      --warn-soft: #3b2c14;
      --danger: #ff8b83;
      --danger-soft: #41211f;
      --info: #70c7e6;
      --info-soft: #183844;
      --shadow: 0 14px 34px rgba(0, 0, 0, .28);
      --focus: 0 0 0 3px rgba(125, 162, 255, .32);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    a:focus-visible, [tabindex]:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    a { color: inherit; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .command-bar {
      position: fixed; inset: 0 0 auto 0; height: var(--header); z-index: 40;
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px 0 12px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex; align-items: center; gap: 9px; min-width: 188px;
      text-decoration: none; font-weight: 720; letter-spacing: -.02em;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
      color: #fff; background: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: -.04em;
    }
    .brand-copy { line-height: 1.05; }
    .brand-copy small { display: block; color: var(--muted); font-size: 11px; font-weight: 520; margin-top: 4px; letter-spacing: 0; }
    .connection {
      display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
      font-size: 12px; white-space: nowrap;
    }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .connection.ok .connection-dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
    .connection.bad .connection-dot { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .last-discovery {
      color: var(--muted); font-size: 12px; white-space: nowrap;
      padding-left: 12px; border-left: 1px solid var(--border);
    }
    .command-search {
      position: relative; flex: 1 1 340px; max-width: 520px; min-width: 160px;
    }
    .command-search .icon { position: absolute; left: 11px; top: 9px; color: var(--faint); width: 17px; height: 17px; pointer-events: none; }
    .command-search input {
      width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface-2); padding: 0 38px 0 35px;
    }
    .command-search input::placeholder { color: var(--faint); }
    .shortcut {
      position: absolute; right: 9px; top: 8px; color: var(--faint); font-size: 11px;
      border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--surface);
    }
    .command-actions { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .btn {
      min-height: 34px; border: 1px solid var(--border-strong); border-radius: 8px;
      padding: 6px 11px; background: var(--surface); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13px; font-weight: 620; text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--surface-2); }
    .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    html[data-theme="dark"] .btn.primary { color: #0b1323; }
    .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
    .btn.subtle { border-color: transparent; background: transparent; color: var(--muted); }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 36%, var(--border)); }
    .btn.small { min-height: 29px; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .btn.icon-only { width: 34px; padding: 0; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .run-progress {
      position: fixed; left: var(--rail); right: 0; top: var(--header); z-index: 39;
      min-height: 30px; display: none; align-items: center; gap: 10px; padding: 5px 16px;
      background: var(--accent-soft); color: var(--accent-strong); border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .run-progress.active { display: flex; }
    .run-track { height: 3px; flex: 1; max-width: 240px; overflow: hidden; border-radius: 4px; background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .run-track span { display: block; height: 100%; width: 35%; border-radius: inherit; background: var(--accent); animation: run 1.35s ease-in-out infinite alternate; }
    @keyframes run { from { transform: translateX(-40%); } to { transform: translateX(225%); } }
    .rail {
      position: fixed; inset: var(--header) auto 0 0; width: var(--rail); z-index: 35;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 10px 6px; background: var(--surface); border-right: 1px solid var(--border);
    }
    .rail a {
      position: relative; width: 48px; height: 46px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); text-decoration: none;
    }
    .rail a:hover { color: var(--text); background: var(--surface-3); }
    .rail a.active { color: var(--accent-strong); background: var(--accent-soft); }
    .rail a.active::before {
      content: ""; position: absolute; left: -7px; width: 3px; height: 24px;
      border-radius: 0 3px 3px 0; background: var(--accent);
    }
    .rail-label {
      position: absolute; left: 57px; top: 8px; z-index: 80;
      opacity: 0; transform: translateX(-5px); pointer-events: none;
      color: var(--text); background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 9px; box-shadow: var(--shadow); white-space: nowrap;
      font-size: 12px; transition: .14s ease;
    }
    .rail a:hover .rail-label, .rail a:focus-visible .rail-label { opacity: 1; transform: translateX(0); }
    .rail-spacer { flex: 1; }
    .nav-count {
      position: absolute; right: 1px; top: 1px; min-width: 17px; height: 17px; padding: 0 5px;
      border-radius: 9px; display: none; place-items: center;
      color: var(--accent-strong); background: var(--accent-soft);
      border: 1px solid var(--border); font-size: 9.5px; font-weight: 700;
    }
    .nav-count.show { display: grid; }
    .main {
      min-width: 0; min-height: 100%; margin-left: var(--rail); padding-top: var(--header);
    }
    .main.run-active { padding-top: calc(var(--header) + 30px); }
    .view { padding: 18px 20px 28px; max-width: 1880px; margin: 0 auto; }
    .page-head {
      display: flex; align-items: flex-start; gap: 12px; margin-bottom: 13px;
    }
    .page-head h1 { font-size: 20px; line-height: 1.25; letter-spacing: -.025em; margin: 0; }
    .page-head p { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
    .page-head-actions { margin-left: auto; display: flex; gap: 7px; align-items: center; }
    .summary-strip {
      display: grid; grid-template-columns: repeat(6, minmax(118px, 1fr));
      margin-bottom: 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .metric {
      min-width: 0; min-height: 58px; padding: 9px 12px; text-align: left;
      border: 0; border-right: 1px solid var(--border); background: transparent;
      display: grid; grid-template-columns: auto 1fr; column-gap: 9px; align-items: center;
    }
    .metric:last-child { border-right: 0; }
    .metric:hover { background: var(--surface-2); }
    .metric strong { font-size: 20px; line-height: 1; letter-spacing: -.03em; }
    .metric span { color: var(--muted); font-size: 11.5px; line-height: 1.25; }
    .metric.is-zero strong, .metric.is-zero span { color: var(--faint); opacity: .72; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); min-width: 0;
    }
    .panel-head {
      min-height: 45px; padding: 10px 13px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head h2 { font-size: 14px; margin: 0; letter-spacing: -.01em; }
    .panel-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .panel-head .push { margin-left: auto; }
    .today-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, .7fr); gap: 14px; }
    .queue { list-style: none; padding: 0; margin: 0; }
    .queue-item {
      min-height: 61px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .queue-item:last-child { border-bottom: 0; }
    .queue-item:hover { background: var(--surface-2); }
    .queue-main { min-width: 0; }
    .queue-title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-meta { color: var(--muted); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-actions { display: flex; gap: 6px; }
    .grade {
      width: 31px; height: 31px; border-radius: 8px; display: grid; place-items: center;
      background: var(--surface-3); color: var(--muted); font-size: 13px; font-weight: 780;
    }
    .grade.a, .grade.b { background: var(--good-soft); color: var(--good); }
    .grade.c { background: var(--warn-soft); color: var(--warn); }
    .grade.d, .grade.f { background: var(--danger-soft); color: var(--danger); }
    .activity-list { padding: 5px 12px 10px; }
    .activity-row { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .activity-row:last-child { border-bottom: 0; }
    .activity-row strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .activity-row span { color: var(--muted); }
    .workbench {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 29%);
      gap: 12px; align-items: start;
    }
    .table-panel { overflow: clip; }
    .filterbar {
      position: sticky; top: var(--header); z-index: 8; padding: 9px 10px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .filterbar input, .filterbar select {
      height: 33px; border: 1px solid var(--border); border-radius: 7px;
      padding: 0 9px; background: var(--surface-2); font-size: 12px;
    }
    .filterbar input { flex: 1 1 210px; min-width: 160px; }
    .filterbar select { max-width: 170px; }
    .filter-count { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
    .active-chips {
      display: flex; gap: 5px; align-items: center; flex-wrap: wrap; padding: 0 10px;
      background: var(--surface); max-height: 0; overflow: hidden;
    }
    .active-chips.has { max-height: none; padding-top: 7px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
    .filter-chip {
      border: 1px solid var(--border); background: var(--surface-2); border-radius: 14px;
      color: var(--muted); padding: 3px 7px; font-size: 11px; display: inline-flex; gap: 5px; align-items: center;
    }
    .filter-chip b { color: var(--text); font-weight: 620; }
    .filter-chip button { border: 0; background: transparent; color: var(--faint); padding: 0; line-height: 1; }
    .bulkbar {
      display: none; align-items: center; gap: 8px; padding: 7px 10px;
      background: var(--accent-soft); color: var(--accent-strong); border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .bulkbar.show { display: flex; }
    .table-scroll { width: 100%; overflow: auto; scrollbar-gutter: stable; }
    .job-table { width: 100%; min-width: 1050px; border-collapse: collapse; table-layout: fixed; }
    .job-table th {
      position: sticky; top: 0; z-index: 3; height: 34px; padding: 6px 8px;
      color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border);
      text-align: left; font-size: 11px; font-weight: 680;
    }
    .job-table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 12px; }
    .job-table tbody tr { cursor: pointer; }
    .job-table tbody tr:hover { background: var(--surface-2); }
    .job-table tbody tr.selected { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
    .job-table tbody tr:last-child td { border-bottom: 0; }
    .job-table .check-col { width: 34px; text-align: center; }
    .job-table .fit-col { width: 50px; }
    .job-table .role-col { width: 195px; }
    .job-table .location-col { width: 145px; }
    .job-table .spon-col { width: 112px; }
    .job-table .posted-col { width: 82px; }
    .job-table .salary-col { width: 112px; }
    .job-table .source-col { width: 112px; }
    .job-table .stage-col { width: 110px; }
    .job-table .stage-col .badge { white-space: nowrap; }
    .unknown { color: var(--muted); font-style: italic; font-weight: 400; }
    .job-table .action-col { width: 150px; }
    .role-title { font-weight: 660; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .role-company { color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-main { line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-sub { color: var(--muted); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      display: inline-flex; align-items: center; max-width: 100%; border-radius: 12px; padding: 3px 7px;
      background: var(--surface-3); color: var(--muted); font-size: 10.5px; font-weight: 650;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .badge.good { color: var(--good); background: var(--good-soft); }
    .badge.warn { color: var(--warn); background: var(--warn-soft); }
    .badge.bad { color: var(--danger); background: var(--danger-soft); }
    .badge.info { color: var(--info); background: var(--info-soft); }
    .row-actions { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .action-overflow { max-width: 82px; min-height: 29px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--muted); font-size: 11px; }
    .action-menu { position: relative; }
    .action-menu > summary { list-style: none; }
    .action-menu > summary::-webkit-details-marker { display: none; }
    .action-pop {
      position: absolute; z-index: 25; right: 0; top: calc(100% + 4px); min-width: 190px;
      padding: 5px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .action-pop button {
      width: 100%; border: 0; border-radius: 6px; padding: 7px 8px;
      background: transparent; text-align: left; color: var(--text); font-size: 12px;
    }
    .action-pop button:hover { background: var(--surface-3); }
    .action-pop button.danger { color: var(--danger); }
    .job-cards { display: none; }
    .pager {
      min-height: 46px; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-top: 1px solid var(--border); color: var(--muted); font-size: 12px;
    }
    .pager .push { margin-left: auto; }
    .inspector {
      position: sticky; top: calc(var(--header) + 12px); max-height: calc(100vh - var(--header) - 24px);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .inspector-empty { padding: 38px 24px; text-align: center; color: var(--muted); }
    .inspector-empty .icon { width: 28px; height: 28px; margin-bottom: 10px; }
    .inspector-head { padding: 13px; border-bottom: 1px solid var(--border); }
    .inspector-title-row { display: flex; gap: 10px; align-items: flex-start; }
    .inspector-title { min-width: 0; flex: 1; }
    .inspector-title h2 { font-size: 15px; line-height: 1.28; margin: 0; }
    .inspector-title p { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
    .inspector-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .inspector-tabs {
      display: flex; overflow-x: auto; padding: 0 7px; border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .inspector-tabs button {
      border: 0; border-bottom: 2px solid transparent; background: transparent;
      color: var(--muted); padding: 9px 7px 8px; font-size: 10.5px; white-space: nowrap;
    }
    .inspector-tabs button.active { color: var(--accent-strong); border-bottom-color: var(--accent); font-weight: 680; }
    .inspector-body { padding: 12px 13px 18px; overflow: auto; min-height: 160px; }
    .inspector-body h3 { font-size: 12px; margin: 16px 0 7px; }
    .inspector-body h3:first-child { margin-top: 0; }
    .inspector-actions {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 12px; margin-top: auto;
      border-top: 1px solid var(--border); background: var(--surface);
    }
    .fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fact { padding: 8px; background: var(--surface-2); border-radius: 7px; min-width: 0; }
    .fact span { display: block; color: var(--muted); font-size: 10px; margin-bottom: 3px; }
    .fact strong { display: block; font-size: 12px; overflow-wrap: anywhere; }
    .explain {
      padding: 9px 10px; border-left: 3px solid var(--border-strong);
      background: var(--surface-2); color: var(--muted); border-radius: 0 7px 7px 0;
      font-size: 12px; line-height: 1.48; white-space: pre-wrap;
    }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .change {
      border: 1px solid var(--border); border-radius: 8px; padding: 9px; margin-bottom: 8px;
      background: var(--surface-2);
    }
    .change-head { font-weight: 680; font-size: 12px; }
    .change-reason { color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.4; }
    .before-after { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
    .before-after div { min-width: 0; padding: 7px; border-radius: 6px; background: var(--surface); font-size: 11px; overflow-wrap: anywhere; }
    .before-after span { display: block; color: var(--faint); font-size: 9px; font-weight: 700; margin-bottom: 3px; }
    .event { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 7px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
    .event time { color: var(--faint); }
    .event strong { display: block; margin-bottom: 2px; }
    .drawer-scrim { display: none; }
    .group-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .group-list { padding: 4px 10px; }
    .group-row {
      display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .group-row:last-child { border-bottom: 0; }
    .group-title { font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-meta { color: var(--muted); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-master { display: flex; align-items: center; gap: 12px; padding: 13px; margin-bottom: 12px; }
    .doc-icon { width: 38px; height: 44px; display: grid; place-items: center; border-radius: 7px; background: var(--accent-soft); color: var(--accent-strong); }
    .doc-main { min-width: 0; flex: 1; }
    .doc-main strong { display: block; }
    .doc-main span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .doc-list { width: 100%; border-collapse: collapse; }
    .doc-list th, .doc-list td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; font-size: 12px; }

      <button class="btn icon-only" id="theme-toggle" aria-label="Toggle light or dark theme"><svg class="icon" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
      <div class="util-wrap">
        <button class="btn icon-only" id="util-menu-btn" aria-label="More: documents, analytics, settings" aria-haspopup="true" aria-expanded="false"><svg class="icon" aria-hidden="true"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg></button>
        <div class="util-menu" id="util-menu" role="menu" hidden>
          <button role="menuitem" data-action="open-util" data-util="documents">Documents</button>
          <button role="menuitem" data-action="open-util" data-util="analytics">Analytics</button>
          <button role="menuitem" data-action="open-util" data-util="settings">Settings &amp; health</button>
          <button role="menuitem" data-action="open-util" data-util="rca">Last run details</button>
          <a role="menuitem" href="/learn/" target="_blank" rel="noopener">Interview Prep</a>
        </div>
      </div>
    </div>
  </header>
  <div class="run-progress" id="run-progress" role="status" aria-live="polite">
    <strong id="run-label">Working</strong><div class="run-track" aria-hidden="true"><span></span></div>
    <span id="run-detail"></span><button class="btn small subtle" id="cancel-run">Cancel</button>
  </div>
  <main class="main" id="main"><div class="view" id="view"><div class="loading-state">Loading your workbench…</div></div></main>
  <div class="drawer-scrim" id="drawer-scrim" data-action="close-inspector"></div>
  <div class="drawer-scrim" id="util-scrim" data-action="close-util"></div>
  <aside class="util-drawer" id="util-drawer" role="dialog" aria-modal="true" aria-labelledby="util-title" hidden>
    <div class="util-head"><h2 id="util-title"></h2><button class="btn icon-only subtle" data-action="close-util" aria-label="Close panel">×</button></div>
    <div class="util-body" id="util-body"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    "use strict";
    var state = {
      route: "today",
      stats: null,
      sections: null,
      jobs: [],
      total: 0,
      pages: 1,
      page: 1,
      limit: 25,
      filters: { view: "all", q: "", fit: "", appStatus: "", source: "", sponsorship: "", ats: "", remote: "", last24h: "", sponsorshipGated: "", submittedThisWeek: "", qualifiedToday: "", employmentType: "", resumeStatus: "", hideClosed: "" },
      filtersOpen: localStorage.getItem("job-agent-filters-open") !== "false",
      sort: "score",
      density: localStorage.getItem("job-agent-density") || "comfortable",
      selectedId: null,
      selected: new Set(),
      detail: null,
      detailTab: "overview",
      loadingJobs: false,
      lastRun: null
    };
    var $ = function (id) { return document.getElementById(id); };
    var view = $("view");
    var ICON_DOC = '<svg class="icon" aria-hidden="true"><path d="M6 2h8l4 4v16H6z"></path><path d="M14 2v5h5M9 12h6M9 16h6"></path></svg>';
    var STATUS_LABEL = {
      submitted: "Submitted", archived: "Archived", rejected: "Rejected", skipped: "Skipped",
      blocked: "Blocked", failed: "Failed", cancelled: "Cancelled", submit_unverified: "Verify submission", ready_for_submit: "Ready for review",
      approved: "Approved to fill", needs_review: "Needs review", shortlisted: "Shortlisted",
      date_unconfirmed: "Verify posting date", discarded: "Not a fit", scored: "Scored", discovered: "Discovered"
    };
    function hasSalaryData() {
      return (state.jobs || []).some(function (j) { return j.compensation; });
    }
    function companyHtml(job) {
      return job && job.company ? h(job.company) : '<em class="unknown">Company not identified</em>';
    }
    function h(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function enc(value) { return encodeURIComponent(String(value == null ? "" : value)); }
    function dec(value) { try { return decodeURIComponent(value || ""); } catch (_) { return value || ""; } }
    function safeUrl(value) {
      try { var u = new URL(String(value || "")); return /^https?:$/.test(u.protocol) ? h(u.href) : "#"; }
      catch (_) { return "#"; }
    }
    function fmt(value) { return Number(value || 0).toLocaleString(); }
    function rel(value) {
      if (!value) return "not run yet";
      var ms = Date.now() - new Date(value).getTime();
      if (!Number.isFinite(ms)) return "unknown";
      if (ms < 60000) return "just now";
      if (ms < 3600000) return Math.floor(ms / 60000) + "m ago";
      if (ms < 86400000) return Math.floor(ms / 3600000) + "h ago";
      return Math.floor(ms / 86400000) + "d ago";
    }
    function dateLabel(value) {
      if (!value) return "—";
      var d = new Date(value);
      return Number.isNaN(d.getTime()) ? "—" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }
    function grade(job) {
      var letter = job && job.grade && job.grade.letter ? job.grade.letter : "—";
      return '<span class="grade ' + h(letter.toLowerCase()) + '" title="' + h(job && job.grade ? job.grade.label : "Not scored") + '">' + h(letter) + "</span>";
    }
    function badge(text, kind) { return '<span class="badge ' + (kind || "") + '">' + h(text) + "</span>"; }
    function statusKind(status) {
      if (["submitted", "ready_for_submit", "approved"].indexOf(status) >= 0) return "good";
      if (["blocked", "failed", "submit_unverified", "rejected"].indexOf(status) >= 0) return "bad";
      if (status === "cancelled") return "warn";
      if (["needs_review", "date_unconfirmed"].indexOf(status) >= 0) return "warn";
      return "info";
    }
    async function api(path, options) {
      var response = await fetch(path, options || {});
      var type = response.headers.get("content-type") || "";
      var body = type.indexOf("json") >= 0 ? await response.json() : await response.text();
      if (!response.ok) throw new Error((body && body.error) || ("Request failed (" + response.status + ")"));
      return body;
    }
    function toast(message, error) {
      var el = $("toast");
      el.textContent = message;
      el.className = "toast show" + (error ? " error" : "");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { el.className = "toast"; }, 3600);
    }
    function pageHead(title, description, actions) {
      return '<div class="page-head"><div><h1>' + h(title) + '</h1><p>' + h(description) + '</p></div><div class="page-head-actions">' + (actions || "") + "</div></div>";
    }
    function loadingPanel(lines) {
      var html = '<div class="panel"><div class="loading-state">';
      for (var i = 0; i < (lines || 4); i += 1) html += '<div class="skeleton" style="width:' + (92 - i * 7) + '%"></div>';
      return html + "</div></div>";
    }
    function emptyState(title, text, actionHtml) {
      return '<div class="empty"><strong>' + h(title) + '</strong><p>' + h(text) + "</p>" + (actionHtml || "") + "</div>";
    }
    function setConnection(ok, text) {
      $("connection").className = "connection " + (ok ? "ok" : "bad");
      $("connection-text").textContent = text || (ok ? "Connected" : "Offline");
    }
    async function loadStats(force) {
      if (state.stats && !force) return state.stats;
      try {
        state.stats = await api("/api/stats");
        setConnection(true, "Connected");
        $("last-discovery").textContent = "Last discovery " + rel(state.stats.lastDiscoveryAt);
        return state.stats;
      } catch (err) {
        setConnection(false, "API unavailable");
        throw err;
      }
    }
    function chipsRow() {
      var t = state.stats ? state.stats.totals || {} : {};
      var run = state.lastRun || {};
      var runChip;
      if (run.running) runChip = ["Run: " + (run.phase || "working") + "\u2026", "", "A background run is in progress."];
      else if (run.lastError) runChip = ["Last run failed", "bad", "The last run failed - open the RCA panel for details."];
      else if (run.partial && degradedOnly(run.rca)) runChip = ["Last run OK (reduced detail)", "warn", "No source failed. Some jobs kept a summary-only description because a board throttled us."];
      else if (run.partial) runChip = ["Last run partial", "warn", "Some sources failed; healthy results were kept."];
      else if (run.finishedAt) runChip = ["Last run OK", "good", "The last background run completed cleanly."];
      else runChip = ["No runs yet", "", "No discovery has run in this session."];
      return '<div class="chips-row" aria-label="Operational status">' +
        '<span class="stat-chip" title="Every job currently tracked in the local database."><b>' + fmt(t.jobsTracked) + '</b> tracked</span>' +
        '<span class="stat-chip" title="Jobs the agent DISCOVERED in the last 24 hours (when found, not when posted)."><b>' + fmt(t.discoveredLast24h) + '</b> found 24h</span>' +
        '<button class="stat-chip linked" data-action="card" data-card="posted24h" title="Actionable jobs whose employer POSTING date is within the last 24 hours. Click to filter."><b>' + fmt(t.postedLast24h) + '</b> posted 24h</button>' +
        '<span class="stat-chip" title="Most recent discovery run.">last discovery <b>' + h(rel(state.stats && state.stats.lastDiscoveryAt)) + '</b></span>' +
        '<button class="stat-chip linked ' + runChip[1] + '" data-action="open-util" data-util="rca" title="' + h(runChip[2]) + '" id="run-chip">' + h(runChip[0]) + '</button>' +
        '</div>';
    }
    function workflowTabs() {
      var v = (state.stats && state.stats.views) || {};
      var tabs = [
        ["all", "All jobs", "Every actionable job (archived/rejected/filtered hidden)."],
        ["best", "Best matches", "Strong, recommended roles still awaiting your triage."],
        ["shortlisted", "Shortlisted", "Roles you shortlisted."],
        ["needs_review", "Needs review", "Prepared packets awaiting your review."],
        ["ready_apply", "Ready to apply", "Approved packets and filled forms waiting on you."],
        ["blocked", "Blocked", "Fill attempts stopped for your input."],
        ["submitted", "Submitted", "Applications recorded as genuinely submitted."]
      ];
      return '<div class="wf-tabs" role="tablist" aria-label="Workflow">' + tabs.map(function (tb) {
        var active = state.filters.view === tb[0];
        return '<button role="tab" id="workflow-tab-' + tb[0] + '" aria-controls="job-results" aria-selected="' + active + '" tabindex="' + (active ? "0" : "-1") + '" class="wf-tab' + (active ? " active" : "") + '" data-action="saved" data-view="' + tb[0] + '" title="' + h(tb[2]) + '">' + h(tb[1]) + '<span class="wf-count">' + fmt(v[tb[0]] || 0) + "</span></button>";
      }).join("") + "</div>";
    }
    function fitCards() {
      var t = state.stats ? state.stats.totals || {} : {};
      var cards = [
        ["strong", t.strongFit, "Strong fit", "good", "Role-fit score 75+ (sponsorship shown separately). Click to filter."],
        ["medium", t.mediumFit, "Medium fit", "", "Worth a look when strong matches run dry."],
        ["weak", t.weakFit, "Weak fit", "", "Low role fit - usually skip."],
        ["new", t.qualifiedToday, "New qualified", "info", "Strong fits whose POSTING is genuinely under 24h old."],
        ["sponsorship", t.needsSponsorshipCheck, "Verify sponsorship", "warn", "Strong fits needing an H-1B sponsorship check before applying."],
        ["datecheck", t.dateUnconfirmed, "Needs date check", "warn", "No reliable posting date - verify freshness manually."]
      ];
      return '<div class="fit-cards" aria-label="Fit and data quality">' + cards.map(function (c) {
        return '<button class="fit-card ' + c[3] + (Number(c[1] || 0) === 0 ? " is-zero" : "") + '" data-action="card" data-card="' + c[0] + '" title="' + h(c[4]) + '"><strong>' + fmt(c[1]) + '</strong><span>' + h(c[2]) + "</span></button>";
      }).join("") + "</div>";
    }
    var UTIL_ROUTES = ["documents", "analytics", "settings", "rca"];
    function routeFromHash() {
      return (location.hash.replace(/^#\//, "").split("?")[0] || "").toLowerCase();
    }
    async function renderRoute() {
      var name = routeFromHash();
      state.route = "workbench";
      view.setAttribute("aria-busy", "true");
      try {
        await loadStats(false);
        if (!view.querySelector("#job-results")) await renderWorkbench();
        // Deep links: #/documents etc. open the matching drawer over the workbench.
        if (UTIL_ROUTES.indexOf(name) >= 0) openUtil(name);
      } catch (err) {
        view.innerHTML = '<div class="error-state"><strong>Could not load the dashboard</strong><p>' + h(err.message) + '</p><button class="btn" data-action="retry">Try again</button></div>';
      } finally {
        view.setAttribute("aria-busy", "false");
      }
    }
    function priorityCopy(job) {
      var labels = {
        ready_for_submission: "Ready for your review and submission",
        submission_unverified: "Confirm whether this application was submitted",
        blocked: "Blocked - a login, CAPTCHA, or question needs you",
        prepared_review: "Review the prepared packet",
        strong_new: "Strong new match — decide while it is fresh",
        verify_sponsorship: "Verify sponsorship before preparing"
      };
      return labels[job.priorityKind] || STATUS_LABEL[job.appStatus] || "Review opportunity";
    }
    function actionButton(job, small) {
      var cls = "btn " + (small ? "small " : "");
      var id = h(enc(job.id));
      if (job.appStatus === "ready_for_submit") return '<button class="' + cls + 'primary" data-action="inspect-tab" data-tab="application" data-job="' + id + '">Review and submit</button>';
      if (job.appStatus === "submit_unverified") return '<button class="' + cls + 'primary" data-action="inspect-tab" data-tab="application" data-job="' + id + '">Verify submission</button>';
      if (["blocked", "failed", "cancelled"].indexOf(job.appStatus) >= 0) return '<button class="' + cls + '" data-action="fill" data-job="' + id + '">Resume application</button>';
      if (job.appStatus === "needs_review") return '<button class="' + cls + 'primary" data-action="inspect-tab" data-tab="resume" data-job="' + id + '">Review resume</button>';
      if (job.appStatus === "approved") return '<button class="' + cls + 'primary" data-action="fill" data-job="' + id + '">Fill in browser</button>';
      if (job.sponsorshipGated) return '<button class="' + cls + '" data-action="inspect-tab" data-tab="sponsorship" data-job="' + id + '">Check sponsorship</button>';
      if (job.appStatus === "shortlisted") return '<button class="' + cls + 'primary" data-action="prepare" data-job="' + id + '">Prepare</button>';
      if (job.appStatus === "submitted") return '<button class="' + cls + '" data-action="inspect" data-job="' + id + '">View activity</button>';
      return '<button class="' + cls + 'primary" data-action="shortlist" data-job="' + id + '">Shortlist</button>';
    }
    function queueRows(rows) {
      if (!rows || !rows.length) return emptyState("Your queue is clear", "No applications need immediate attention. Find new jobs when you are ready.", '<button class="btn primary" data-action="find">Find new jobs</button>');
      return '<ol class="queue">' + rows.map(function (job) {
        return '<li class="queue-item"><button class="btn subtle icon-only" data-action="inspect" data-job="' + h(enc(job.id)) + '" aria-label="Inspect ' + h(job.title) + '">' + grade(job) + '</button><div class="queue-main"><div class="queue-title">' + h(job.title) + ' <span style="color:var(--muted);font-weight:500">at ' + companyHtml(job) + '</span></div><div class="queue-meta">' + h(priorityCopy(job)) + ' · ' + h(job.postedLabel || "date unconfirmed") + ' · ' + h(job.location || "Location not listed") + '</div></div><div class="queue-actions">' + actionButton(job, true) + "</div></li>";
      }).join("") + "</ol>";
    }
    function prioPanel() {
      var sec = state.sections || {};
      var items = (sec.todaysPriorities || []).slice(0, 6);
      var count = (sec.counts && sec.counts.todaysPriorities) || items.length;
      var body;
      if (!items.length) body = '<div class="prio-empty">Queue is clear - nothing needs you right now.</div>';
      else body = '<ol class="prio-list">' + items.map(function (job) {
        return '<li><button class="prio-item" data-action="inspect" data-job="' + h(enc(job.id)) + '">' + grade(job) +
          '<span class="prio-main"><span class="prio-title">' + h(job.title) + '</span><span class="prio-meta">' + companyHtml(job) + ' \u00b7 ' + h(priorityCopy(job)) + "</span></span></button></li>";
      }).join("") + "</ol>";
      return '<div class="panel-head slim"><div><h2>Today\u2019s priorities</h2><p>' + fmt(count) + ' item(s), highest first</p></div><button class="btn small subtle" data-action="saved" data-view="today">All</button></div>' + body;
    }
    /** True when every RCA entry kept its results (fidelity loss, not data loss). */
    function degradedOnly(entries) {
      var list = entries || [];
      return list.length > 0 && list.every(function (e) { return e.degraded; });
    }
    function rcaBanner() {
      var run = state.lastRun || {};
      if (run.running) return "";
      var entries = run.rca || [];
      if (run.lastError) {
        return '<div class="rca-banner failed" role="alert"><strong>Last ' + h(run.phase || "run") + ' failed.</strong><span>' + h(run.lastError) + '</span><span class="push">' + (run.phase ? '<button class="btn small" data-action="retry-run" data-phase="' + h(run.phase) + '">Retry</button>' : "") + '<button class="btn small subtle" data-action="open-util" data-util="rca">View technical details</button></span></div>';
      }
      if (entries.length && run.partial && degradedOnly(entries)) {
        var kept = entries.reduce(function (n, e) { return n + (e.count || 1); }, 0);
        return '<div class="rca-banner" role="status"><strong>All jobs kept.</strong><span>' + h(String(kept)) + ' job(s) kept a summary-only description because a board rate-limited us. Nothing was lost — re-run later to fill in the full descriptions.</span><span class="push">' + (run.phase ? '<button class="btn small" data-action="retry-run" data-phase="' + h(run.phase) + '">Re-run</button>' : "") + '<button class="btn small subtle" data-action="open-util" data-util="rca">View technical details</button></span></div>';
      }
      if (entries.length && run.partial) {
        var srcs = [];
        entries.forEach(function (e) { if (e.source && srcs.indexOf(e.source) === -1) srcs.push(e.source); });
        return '<div class="rca-banner" role="status"><strong>Partial results.</strong><span>' + h(String(srcs.length || entries.length)) + ' source(s) failed (' + h(srcs.slice(0, 4).join(", ") || "see details") + '); results from healthy sources were kept and are shown below.</span><span class="push">' + (run.phase ? '<button class="btn small" data-action="retry-run" data-phase="' + h(run.phase) + '">Retry failed run</button>' : "") + '<button class="btn small subtle" data-action="open-util" data-util="rca">View technical details</button></span></div>';
      }
      return "";
    }
    function refreshRcaSlot() {
      var slot = $("rca-slot");
      if (slot) slot.innerHTML = rcaBanner();
    }
    async function renderWorkbench() {
      try { state.sections = await api("/api/sections"); } catch (_) { state.sections = state.sections || {}; }
      view.innerHTML = chipsRow() + workflowTabs() +
        '<div id="rca-slot">' + rcaBanner() + '</div>' +
        fitCards() +
        '<div class="workbench"><section class="panel table-panel">' + filterToolbar() + '<div id="job-results"><div class="loading-state"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div></section>' +
        '<aside class="right-col"><section class="panel prio-panel" id="prio-panel">' + prioPanel() + '</section>' + inspectorPlaceholder() + '</aside></div>' +
        insightsPanels();
      document.body.classList.toggle("compact", state.density === "compact");
      wireFilterControls();
      await loadJobs();
    }
    function insightsPanels() {
      var stats = state.stats || {};
      var open = localStorage.getItem("job-agent-insights-open") !== "false";
      var srcs = Object.keys(stats.bySource || {}).map(function (k) { return Object.assign({ source: k }, stats.bySource[k]); })
        .sort(function (a, b) { return b.found - a.found; }).slice(0, 8);
      var spons = Object.keys(stats.bySponsorship || {}).map(function (k) { return Object.assign({ label: k }, stats.bySponsorship[k]); })
        .sort(function (a, b) { return b.count - a.count; });
      var blockedGroups = ((state.sections || {}).blockedByReason || []).slice(0, 5);
      var daily = stats.daily || [];
      var dMax = Math.max(1, ...daily.map(function (d) { return d.discovered; }));
      var body = '<div class="insights-grid">' +
        '<section class="panel"><div class="panel-head slim"><div><h2>Source performance</h2><p>found / strong / prepared / submitted</p></div></div><table class="data-table slim"><tbody>' +
          (srcs.map(function (r) { return '<tr><td>' + h(r.source) + '</td><td class="num">' + fmt(r.found) + '</td><td class="num">' + fmt(r.strong) + '</td><td class="num">' + fmt(r.prepared) + '</td><td class="num">' + fmt(r.submitted) + '</td></tr>'; }).join("") || '<tr><td class="cell-sub">No sources yet</td></tr>') + '</tbody></table></section>' +
        '<section class="panel"><div class="panel-head slim"><div><h2>Sponsorship feasibility</h2><p>jobs / strong fits</p></div></div><table class="data-table slim"><tbody>' +
          (spons.map(function (r) { return '<tr><td>' + h(r.label) + '</td><td class="num">' + fmt(r.count) + '</td><td class="num">' + fmt(r.strong) + '</td></tr>'; }).join("") || '<tr><td class="cell-sub">No data</td></tr>') + '</tbody></table></section>' +
        '<section class="panel"><div class="panel-head slim"><div><h2>Blocked reasons</h2><p>fix similar walls in one pass</p></div></div><table class="data-table slim"><tbody>' +
          (blockedGroups.map(function (g) { return '<tr><td>' + h(g.reason) + '</td><td class="num">' + fmt(g.count) + '</td></tr>'; }).join("") || '<tr><td class="cell-sub">Nothing blocked</td></tr>') + '</tbody></table></section>' +
        '<section class="panel"><div class="panel-head slim"><div><h2>Last 7 days</h2><p>discovered / prepared / submitted</p></div></div><table class="data-table slim"><tbody>' +
          (daily.map(function (d) { return '<tr><td>' + h(d.day.slice(5)) + '</td><td>' + fmt(d.discovered) + ' <span class="mini-bar"><i style="width:' + Math.round(d.discovered / dMax * 100) + '%"></i></span></td><td class="num">' + fmt(d.prepared) + '</td><td class="num">' + fmt(d.submitted) + '</td></tr>'; }).join("") || '<tr><td class="cell-sub">No activity yet</td></tr>') + '</tbody></table></section>' +
        '</div>';
      return '<section class="insights"><button class="insights-toggle" data-action="toggle-insights" aria-expanded="' + open + '">Insights ' + (open ? "\u25be" : "\u25b8") + '</button>' + (open ? body : "") + '</section>';
    }
    function filterOptions(values, selected, placeholder) {
      var out = '<option value="">' + h(placeholder) + "</option>";
      values.forEach(function (v) { out += '<option value="' + h(v) + '"' + (String(selected) === String(v) ? " selected" : "") + ">" + h(v) + "</option>"; });
      return out;
    }
    function filterToolbar() {
      var sources = Object.keys((state.stats && state.stats.bySource) || {}).sort();
      var statuses = [["discovered","Discovered"],["scored","Scored"],["shortlisted","Shortlisted"],["needs_review","Needs review"],["approved","Approved"],["ready_for_submit","Ready for review"],["blocked","Blocked"],["failed","Failed"],["cancelled","Cancelled"],["submit_unverified","Verify submission"],["submitted","Submitted"],["rejected","Rejected"],["archived","Archived"],["discarded","Not a fit"],["date_unconfirmed","Date unconfirmed"]];

        else if (action === "next-page") { state.page = Math.min(state.pages, state.page + 1); await loadJobs(); }
        else if (action === "clear-filter") { state.filters[target.dataset.filter] = target.dataset.filter === "view" ? "all" : ""; state.page = 1; await renderWorkbench(); }
        else if (action === "clear-filters") { Object.keys(state.filters).forEach(function (k) { state.filters[k] = k === "view" ? "all" : ""; }); state.page = 1; await renderWorkbench(); }
        else if (action === "reload-jobs") await loadJobs();
        else if (action === "retry") { state.stats = null; await renderRoute(); }
        else if (action === "find") await runPhase("discover");
        else if (action === "prepare-selected") await bulkDecision("prepare");
        else if (action === "auto-selected") await previewAutoApply(Array.from(state.selected), "Selected jobs");
        else if (action === "auto-job") await previewAutoApply([id], "One job");
        else if (action === "auto-best") await previewBestAutoApply();
        else if (action === "confirm-auto-apply") await confirmAutoApply();
        else if (action === "shortlist-selected") await bulkDecision("shortlisted");
        else if (action === "reject-selected") await bulkDecision("rejected");
        else if (action === "clear-selection") { state.selected.clear(); renderJobResults(); updateBulkbar(); }
        else if (action === "save-note") { await postJson("/api/jobs/" + enc(id) + "/note", { note: $("note-box").value }); toast("Note saved."); }
        else if (action === "copy") { await navigator.clipboard.writeText(target.dataset.copy || ""); toast("Path copied."); }
        else if (action === "run-health") await runHealth();
        else if (action === "theme") toggleTheme();
        else if (action === "open-util") { toggleUtilMenu(false); openUtil(target.dataset.util); }
        else if (action === "close-util") closeUtil();
        else if (action === "retry-run") { toast("Retrying " + target.dataset.phase + "\u2026"); await runPhase(target.dataset.phase); }
        else if (action === "toggle-insights") { localStorage.setItem("job-agent-insights-open", String(localStorage.getItem("job-agent-insights-open") === "false")); await renderWorkbench(); }
        else if (action === "toggle-filters") { state.filtersOpen = !state.filtersOpen; localStorage.setItem("job-agent-filters-open", String(state.filtersOpen)); var fb = document.querySelector(".filterbar"); if (fb) fb.classList.toggle("collapsed", !state.filtersOpen); target.setAttribute("aria-expanded", String(state.filtersOpen)); }
      } catch (err) { toast(err.message, true); }
    });
    document.addEventListener("change", function (event) {
      var overflow = event.target.closest(".action-overflow");
      if (overflow && overflow.value) {
        var action = overflow.value;
        var id = dec(overflow.dataset.job);
        overflow.value = "";
        if (action === "inspect") openFromAnywhere(id, "overview");
        else if (action === "auto-job") previewAutoApply([id], "One job").catch(function (err) { toast(err.message, true); });
        else mutateJob(action, id).catch(function (err) { toast(err.message, true); });
        return;
      }
      if (event.target.id === "auto-consent") {
        var confirm = $("confirm-auto-apply");
        var eligible = Number((state.autoApplyPreview || {}).eligible || 0);
        // Consent alone never enables the button — there must also be at
        // least one eligible job. "Auto-Apply 0 job(s)" must stay disabled.
        if (confirm) confirm.disabled = !event.target.checked || eligible === 0;
        return;
      }
      var checkbox = event.target.closest("[data-select-job]");
      if (!checkbox) return;
      var id = dec(checkbox.dataset.selectJob);
      if (checkbox.checked) state.selected.add(id); else state.selected.delete(id);
      document.querySelectorAll('[data-select-job="' + CSS.escape(checkbox.dataset.selectJob) + '"]').forEach(function (x) { x.checked = checkbox.checked; });
      updateBulkbar();
    });
    document.addEventListener("click", function (event) {
      if (event.target.closest("[data-action]") || event.target.closest("[data-select-job]") || event.target.closest(".action-overflow")) return;
      var row = event.target.closest("[data-row-job]");
      if (row) openFromAnywhere(dec(row.dataset.rowJob), "overview");
    });
    document.addEventListener("keydown", function (event) {
      var activeTab = event.target.closest('[role="tab"]');
      if (activeTab && ["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(event.key) >= 0) {
        var tablist = activeTab.closest('[role="tablist"]');
        var tabs = Array.from(tablist ? tablist.querySelectorAll('[role="tab"]') : []);
        var index = tabs.indexOf(activeTab);
        if (tabs.length) {
          event.preventDefault();
          if (event.key === "Home") index = 0;
          else if (event.key === "End") index = tabs.length - 1;
          else index = (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
          tabs[index].focus();
          tabs[index].click();
        }
        return;
      }
      if (event.key === "Tab" && !$("util-drawer").hidden) {
        var focusable = Array.from($("util-drawer").querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
        if (focusable.length) {
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      }
      if (event.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { event.preventDefault(); $("global-search").focus(); }
      if (event.key === "Escape") {
        if (!$("util-menu").hidden) { toggleUtilMenu(false); return; }
        if (!$("util-drawer").hidden) { closeUtil(); return; }
        var ins = $("inspector"); if (ins) ins.classList.remove("open"); $("drawer-scrim").classList.remove("open");
      }
      if (event.key === "Enter") {
        var row = event.target.closest("[data-row-job]");
        if (row && !event.target.closest("button,input,a,select")) openFromAnywhere(dec(row.dataset.rowJob), "overview");
      }
    });
    $("global-search").addEventListener("keydown", function (event) {
      if (event.key !== "Enter") return;
      state.filters.q = event.target.value.trim(); state.page = 1;
      renderWorkbench();
    });
    $("find-jobs").addEventListener("click", function () { runPhase("discover"); });
    $("rescore").addEventListener("click", function () { runPhase("score"); });
    $("prepare-selected").addEventListener("click", function () { bulkDecision("prepare"); });
    $("auto-selected").addEventListener("click", function () { previewAutoApply(Array.from(state.selected), "Selected jobs"); });
    $("auto-best").addEventListener("click", function () { previewBestAutoApply().catch(function (err) { toast(err.message, true); }); });
    $("cancel-run").addEventListener("click", async function () { try { await postJson("/api/run/cancel"); toast("Cancellation requested. The current safe step will finish first."); } catch (err) { toast(err.message, true); } });
    $("theme-toggle").addEventListener("click", toggleTheme);
    $("addurl-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      var pop = $("addurl-pop");
      pop.hidden = !pop.hidden;
      $("addurl-btn").setAttribute("aria-expanded", String(!pop.hidden));
      if (!pop.hidden) $("addurl-input").focus();
    });
    $("addurl-pop").addEventListener("submit", async function (e) {
      e.preventDefault();
      var url = $("addurl-input").value.trim();
      if (!url) return;
      var btn = $("addurl-submit");
      if (btn.disabled) return; // duplicate-click protection
      btn.disabled = true;
      try {
        await postJson("/api/add-url", { url: url });
        toast("Job added and scored.");
        $("addurl-input").value = "";
        $("addurl-pop").hidden = true;
        await refreshVisible();
      } catch (err) { toast(err.message, true); }
      finally { btn.disabled = false; }
    });
    document.addEventListener("click", function (e) { if (!e.target.closest(".addurl-wrap")) { var pop = $("addurl-pop"); if (pop && !pop.hidden) { pop.hidden = true; $("addurl-btn").setAttribute("aria-expanded", "false"); } } });
    $("util-menu-btn").addEventListener("click", function (e) { e.stopPropagation(); toggleUtilMenu(); });
    document.addEventListener("click", function (e) { if (!e.target.closest(".util-wrap")) toggleUtilMenu(false); });
    window.addEventListener("hashchange", renderRoute);
    (function boot() {
      var savedTheme = localStorage.getItem("job-agent-theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
      document.body.classList.toggle("compact", state.density === "compact");
      renderRoute();
      pollRun();
    })();
  </script>
</body>
</html>
