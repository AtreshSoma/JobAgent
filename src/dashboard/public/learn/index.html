<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Engineer Interview Academy</title>
  <meta name="description" content="A professional, end-to-end course to prepare for Senior / Lead Data Engineer interviews — built from real job descriptions." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EDE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand" role="button" onclick="location.hash='#/home'">
        <div class="logo">DE</div>
        <div class="title">Interview Academy<small id="academyScope">Interview preparation</small></div>
      </div>
      <div class="search-wrap">
        <input class="search" id="search" type="text" placeholder="Search topics…  ( / )" autocomplete="off" />
      </div>
      <nav class="nav" id="nav" aria-label="Course navigation"></nav>
      <div class="sidebar-foot">
        <div>Your progress</div>
        <div class="progress-mini"><span id="progressBar"></span></div>
        <div id="progressText">0 of 0 lessons complete</div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="crumb" id="crumb"></div>
        <div class="spacer"></div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle light / dark">🌙</button>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Course content (each file registers one module) -->
  <script src="assets/js/content-00-intro.js"></script>
  <script src="assets/js/content-01-sql.js"></script>
  <script src="assets/js/content-02-python-pyspark.js"></script>
  <script src="assets/js/content-03-spark-delta.js"></script>
  <script src="assets/js/content-04-modeling.js"></script>
  <script src="assets/js/content-05-pipelines.js"></script>
  <script src="assets/js/content-06-azure.js"></script>
  <script src="assets/js/content-07-gaps.js"></script>
  <script src="assets/js/content-08-system-design.js"></script>
  <script src="assets/js/content-09-behavioral.js"></script>
  <script src="assets/js/content-10-mocks.js"></script>
  <!-- App engine -->
  <script src="assets/js/app.js"></script>
</body>
</html>
