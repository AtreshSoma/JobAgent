<!doctype html><html><head><title>Candidate profile</title></head><body>
<h2>Create your profile</h2>
<form id="candidate-form" onsubmit="return false">
  <label for="firstname">First Name *</label><input id="firstname" name="firstname" required>
  <label for="lastname">Last Name *</label><input id="lastname" name="lastname" required>
  <label for="email">Email Address *</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone">
  <label for="resume">Resume</label><input id="resume" name="resume" type="file">
  <input type="button" id="next" class="iCIMS_Button" value="Next">
</form>
<script>
  document.getElementById('next').addEventListener('click', () => {
    history.pushState({}, '', '/jobs/1/apply/questions');
    document.body.innerHTML = '<h2>Application questions</h2><form id="q" onsubmit="return false">'
      + '<label for="auth">Are you legally authorized to work in the United States?</label>'
      + '<select id="auth" name="auth" required><option value=""></option><option>Yes</option><option>No</option></select>'
      + '<input type="submit" id="final" value="Submit"></form>';
    document.getElementById('final').addEventListener('click', () => { window.__submitted = true; });
  });
</script></body></html>
